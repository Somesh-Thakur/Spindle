[package]
name = "spindle"
version = "1.0.0"
description = "Spindle for desktop"
authors = ["Somesh Sanjay Thakur"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
discord-rich-presence = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small and quick to start: the app is a thin shell around the website.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# The same versions Tauri uses, for trimming memory while hidden.
webview2-com = "0.39"
windows = "0.62"
