<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060b" />
    <link rel="icon" type="image/svg+xml" href="/brand/spindle-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/spindle-icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Installed from Safari's Share menu, Spindle opens full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- An opaque status bar: the see-through one makes iOS give the page a short height (a black strip at the bottom). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Spindle" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spindle" />
    <meta property="og:title" content="Spindle · Every record you love, on every screen" />
    <meta property="og:description" content="Full songs, live lyrics and karaoke, with your library synced between your phone and your computer. Free." />
    <meta property="og:url" content="https://spindle-bice.vercel.app/" />
    <meta property="og:image" content="https://spindle-bice.vercel.app/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Geist:wght@300..700&family=Mukta:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <title>Spindle · Free music player with full songs, live lyrics and karaoke</title>
    <meta name="description" content="Spindle is a free music player: full songs, live lyrics, karaoke and story cards, with your playlists synced between your phone, your computer and the desktop app. Import from Spotify, Apple Music and YouTube Music." />
    <link rel="canonical" href="https://spindle-bice.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Spindle",
        "url": "https://spindle-bice.vercel.app/",
        "description": "A free music player with full songs, live lyrics, karaoke and story cards, and a library that syncs between your devices.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web, Windows, macOS, iOS, Android",
        "image": "https://spindle-bice.vercel.app/brand/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Somesh Sanjay Thakur", "url": "https://github.com/Somesh-Thakur" },
        "downloadUrl": "https://github.com/Somesh-Thakur/Spindle/releases/latest"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- For anything that doesn't run the app's code: what Spindle is, in plain HTML. -->
    <noscript>
      <h1>Spindle: a free music player</h1>
      <p>Full songs, live lyrics, karaoke and story cards, with your library synced between your phone, your computer and the desktop app. Import playlists from Spotify, Apple Music and YouTube Music. Spindle needs JavaScript to play music.</p>
      <p><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="https://github.com/Somesh-Thakur/Spindle/releases/latest">Desktop app</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
