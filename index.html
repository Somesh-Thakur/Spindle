<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060b" />
    <link rel="icon" type="image/svg+xml" href="/brand/spindle-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/spindle-icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Open connections early to the account server and song lookup. -->
    <link rel="preconnect" href="https://dietspufohjzyfeleqlj.supabase.co" crossorigin />
    <link rel="preconnect" href="https://pipedapi.ducks.party" crossorigin />
    <link rel="preconnect" href="https://api.piped.private.coffee" crossorigin />
    <!-- Installed from Safari's Share menu, Spindle opens full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- An opaque status bar: the see-through one makes iOS give the page a short height (a black strip at the bottom). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Spindle" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spindle" />
    <meta property="og:title" content="Spindle · Every record you love, on every screen" />
    <meta property="og:description" content="Full songs, live lyrics and karaoke, with your library synced between your phone and your computer. Free." />
    <meta property="og:url" content="https://somesh-thakur.github.io/Spindle/" />
    <meta property="og:image" content="https://somesh-thakur.github.io/Spindle/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Spindle</title>
    <meta name="description" content="A private music player." />
    <link rel="canonical" href="https://somesh-thakur.github.io/Spindle/" />
    <!-- Spindle is private: search engines shouldn't list it. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Proves ownership to Google Search Console. -->
    <meta name="google-site-verification" content="BrVWE6RePPt5hFz1LXVlt91aiBayIg_6AAGNtuX-vf4" />
  </head>
